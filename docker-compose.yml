services:
  # --- 1. NGINX (Reverse Proxy) ---
  nginx:
    image: nginx:alpine
    container_name: nan-verse-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web-network
    restart: always
    depends_on:
      - server
      - client

  # --- 2. BACKEND SERVER ---
  server:
    image: ghcr.io/pichaya-big/nan-local-verse-engine-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nan-verse-server
    env_file:
      - ./server/.env
    networks:
      - web-network
    restart: always

  # --- 3. FRONTEND CLIENT ---
  client:
    image: ghcr.io/pichaya-big/nan-local-verse-engine-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nan-verse-client
    env_file:
      - ./client/.env.local
    environment:
      - PORT=3000
      - FASTAPI_URL=http://server:8000
    networks:
      - web-network
    restart: always
    depends_on:
      - server

networks:
  web-network:
    name: nan-verse-net