name: Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3-beta, etc.

# Permissions required for Github Actions to push packages to GHCR and create Releases
permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------
  # 1. CLIENT CI (Node.js & Next.js Build/Lint Check)
  # ----------------------------------------------------
  client-ci:
    name: Client CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create client .env.local file
        run: |
          cat << 'EOF' > ./client/.env.local
          ${{ secrets.ENV_CLIENT }}
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint Client Code
        working-directory: ./client
        run: npm run lint

      - name: Build Client (Production Check)
        working-directory: ./client
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ----------------------------------------------------
  # 2. SERVER CI (Python & uv Check)
  # ----------------------------------------------------
  server-ci:
    name: Server CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python Dependencies
        working-directory: ./server
        run: uv pip install --system -r pyproject.toml

      - name: Verify Python Code compilation
        working-directory: ./server
        run: python -m compileall app/

  # ----------------------------------------------------
  # 3. DOCKER BUILD & PUBLISH TO GHCR
  # ----------------------------------------------------
  docker-publish:
    name: Docker Build & Push to GHCR
    needs: [client-ci, server-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create client .env.local file
        run: |
          cat << 'EOF' > ./client/.env.local
          ${{ secrets.ENV_CLIENT }}
          EOF

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lowercase Image Tags
        id: prep
        run: |
          # GHCR requires lowercase repository names
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG_NAME="${{ github.ref_name }}"
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Build & Push Client Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-client:${{ env.TAG_NAME }}
            ghcr.io/${{ env.REPO_LOWER }}-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-server:${{ env.TAG_NAME }}
            ghcr.io/${{ env.REPO_LOWER }}-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # 4. CREATE GITHUB RELEASE
  # ----------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # 5. SSH DEPLOY TO VPS
  # ----------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to the project directory on VPS
            cd ${{ secrets.PROJECT_PATH }}
            
            # Pull latest changes from the repository (e.g. docker-compose config updates)
            git pull || true
            
            # Create client .env.local file on VPS
            cat << 'EOF' > client/.env.local
            ${{ secrets.ENV_CLIENT }}
            EOF
            
            # Create server .env file on VPS
            cat << 'EOF' > server/.env
            ${{ secrets.ENV_SERVER }}
            EOF
            
            # Pull the newly built Docker images from GHCR
            docker compose pull
            
            # Recreate containers with the new images in background mode
            docker compose up -d
            
            # Clean up old unused Docker images to save disk space
            docker image prune -f

